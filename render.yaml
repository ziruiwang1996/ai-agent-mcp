services:
  - type: web
    name: med-helper-server
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # Choose an appropriate plan based on your needs
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # This requires you to set the value in the Render dashboard
    healthCheckPath: /health
    numInstances: 1
    buildFilter:
      paths:
        - Dockerfile
        - "**/*.py"
        - "requirements.txt"
        - "mcp_servers/mcp_server_config.json"
